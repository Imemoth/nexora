# Phase 0 CI gates. Runs on the exact commit under test.
# No Supabase or other secrets are used by this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md and .metadata (Flutter 3.47.9 stable, Dart 3.13.7).
  FLUTTER_VERSION: "3.47.9"
  DART_VERSION: "3.13.7"

jobs:
  windows:
    name: Windows analyze, test, build, package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify Flutter and Dart versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter_line="$(flutter --version | head -n 1)"
          dart_line="$(dart --version 2>&1 | head -n 1)"
          echo "Expected Flutter ${FLUTTER_VERSION}, Dart ${DART_VERSION}"
          echo "Found: ${flutter_line} | ${dart_line}"
          case "$flutter_line" in *"Flutter ${FLUTTER_VERSION} "*) ;; *) echo "Flutter version mismatch"; exit 1;; esac
          case "$dart_line" in *"${DART_VERSION}"*) ;; *) echo "Dart version mismatch"; exit 1;; esac

      - name: Resolve dependencies
        # Fails if pubspec.lock would change: the committed lockfile is the
        # reproducible resolution for this exact commit.
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Cross-process restart check (SQLite)
        shell: pwsh
        run: ./tool/persistence/restart_check.ps1

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package and smoke-test portable ZIP
        shell: pwsh
        run: ./tool/package_windows.ps1 -OutputDir ./dist

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexora-windows-portable
          path: dist/nexora-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
