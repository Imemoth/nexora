# Phase 0 CI gates. Runs on the exact commit under test.
# No Supabase or other secrets are used by this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run on an exact commit of a feature branch (no PR needed); same gates, no secrets.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md and .metadata (Flutter 3.47.9 stable, Dart 3.13.7).
  FLUTTER_VERSION: "3.47.9"
  DART_VERSION: "3.13.7"

jobs:
  windows:
    name: Windows analyze, test, build, package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify Flutter and Dart versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter_line="$(flutter --version | head -n 1)"
          dart_line="$(dart --version 2>&1 | head -n 1)"
          echo "Expected Flutter ${FLUTTER_VERSION}, Dart ${DART_VERSION}"
          echo "Found: ${flutter_line} | ${dart_line}"
          case "$flutter_line" in *"Flutter ${FLUTTER_VERSION} "*) ;; *) echo "Flutter version mismatch"; exit 1;; esac
          case "$dart_line" in *"${DART_VERSION}"*) ;; *) echo "Dart version mismatch"; exit 1;; esac

      - name: Resolve dependencies
        # Fails if pubspec.lock would change: the committed lockfile is the
        # reproducible resolution for this exact commit.
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Show formatting diff (only when the check failed)
        if: failure()
        run: |
          dart format --output=write .
          git --no-pager diff --stat
          git --no-pager diff

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Cross-process restart check (SQLite)
        shell: pwsh
        run: ./tool/persistence/restart_check.ps1

      - name: Build Windows release
        run: flutter build windows --release

      - name: Shell integration smoke (single instance, minimize to tray, restore, tray Exit)
        # Drives the real nexora.exe with the window messages the Windows shell sends. Exit code 2 means the runner has no
        # interactive desktop (checks not run); 1 means a check failed.
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ./dist | Out-Null
          ./tool/windows_shell_smoke.ps1 -Log ./dist/shell-smoke.log
          exit $LASTEXITCODE

      - name: Package and smoke-test portable ZIP
        shell: pwsh
        run: ./tool/package_windows.ps1 -OutputDir ./dist

      - name: Record SHA-256 of the ZIP and of every file in it
        shell: pwsh
        run: |
          $zip = './dist/nexora-windows-portable.zip'
          $lines = @("$((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())  nexora-windows-portable.zip", "commit  $env:GITHUB_SHA")
          $tmp = Join-Path $env:RUNNER_TEMP 'rc-contents'
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          Get-ChildItem -Path $tmp -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($tmp.Length + 1).Replace('\', '/')
            $lines += "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $rel"
          }
          $lines | Set-Content -Path ./dist/SHA256SUMS.txt -Encoding ascii
          $lines | Select-Object -First 2 | ForEach-Object { Write-Host $_ }
          Get-Content ./dist/SHA256SUMS.txt | Select-Object -First 2 | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexora-windows-portable
          path: |
            dist/nexora-windows-portable.zip
            dist/SHA256SUMS.txt
            dist/shell-smoke.log
          if-no-files-found: error
          retention-days: 14
