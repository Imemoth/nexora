# Temporary one-shot workflow: applies the pinned Dart formatter and reports the
# formatting-only change through the job log (artifact transport was failing).
# Prints: changed file list, a bounded unified diff, and per-file Base64 of the
# formatted blob in chunks of at most 2048 characters, with SHA-256 hashes.
# Removed after the fix lands.
name: format-once

on:
  push:
    branches: [feature/phase-1-domain]
    paths: [".github/workflows/format-once.yml"]

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.9 (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: Format and emit formatting-only changes to the log
        shell: bash
        run: |
          set -uo pipefail
          echo "===REPORT-BEGIN==="
          flutter --version | head -n 1
          dart --version 2>&1 | head -n 1
          dart format . 2>&1 | tail -n 1
          git add -- '*.dart'
          mapfile -t changed < <(git diff --cached --name-only -- '*.dart')
          echo "CHANGED_COUNT=${#changed[@]}"
          for f in "${changed[@]}"; do echo "CHANGED_FILE=$f"; done
          echo "===DIFF-BEGIN==="
          git diff --cached -U2 -- '*.dart' | head -c 90000
          echo "===DIFF-END==="
          for f in "${changed[@]}"; do
            orig_sha=$(git show "HEAD:$f" | sha256sum | cut -d' ' -f1)
            fmt_sha=$(git show ":$f" | sha256sum | cut -d' ' -f1)
            b64=$(git show ":$f" | base64 -w0)
            n=$(printf '%s' "$b64" | fold -w 2048 | wc -l)
            echo "===FILE-BEGIN path=$f orig_sha256=$orig_sha fmt_sha256=$fmt_sha chunks=$n==="
            printf '%s' "$b64" | fold -w 2048 | awk '{printf "CHUNK %03d %s\n", NR, $0}'
            echo "===FILE-END path=$f==="
          done
          dart format --output=none --set-exit-if-changed . >/dev/null 2>&1 && echo "POST_FORMAT_CHECK=clean" || echo "POST_FORMAT_CHECK=changes_remain"
          echo "===REPORT-END==="
