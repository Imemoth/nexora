# Temporary one-shot workflow: applies the pinned Dart formatter to the repo
# and uploads lib/ and test/ so the formatting-only diff can be reviewed and
# committed. Removed after the fix lands.
name: format-once

on:
  push:
    branches: [feature/phase-1-domain]
    paths: [".github/workflows/format-once.yml"]

permissions:
  contents: read

jobs:
  format:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.9 (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: Record versions
        shell: bash
        run: |
          flutter --version
          dart --version

      - name: Format and report
        shell: bash
        run: |
          dart format .
          dart format --output=none --set-exit-if-changed . && echo "formatted: stable"

      - name: Upload formatted sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatted-sources
          path: |
            lib
            test
          if-no-files-found: error
