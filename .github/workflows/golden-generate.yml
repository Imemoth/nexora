# TEMPORARY one-shot workflow: generates golden baselines on the pinned Windows
# runner for the Task 8 branch. Removed in the commit that adds the baselines.
name: Golden generate (temporary)

on:
  push:
    branches: [feature/phase-1-golden]

permissions:
  contents: read

jobs:
  goldens:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: Verify versions
        shell: bash
        # No pipes into head: a pipe closed early makes the Flutter tool retry its
        # own pub upgrade forever (the stall seen in run 43179596429).
        run: |
          set -euo pipefail
          flutter --version > flutter-version.txt 2>&1
          dart --version > dart-version.txt 2>&1
          cat flutter-version.txt dart-version.txt

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate golden baselines
        run: flutter test --update-goldens test/golden/shell_golden_test.dart

      - name: Upload goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexora-goldens
          path: test/golden/goldens
          if-no-files-found: error
          retention-days: 14
