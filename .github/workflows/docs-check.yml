# Documentation consistency check (links, referenced paths, migration list, stale phrases). No secrets.
name: docs-check
on:
  pull_request:
    paths: ['docs/**', 'tools/check_docs.py', 'supabase/migrations/**']
  push:
    branches: ['claude/**']
    paths: ['docs/**', 'tools/check_docs.py', 'supabase/migrations/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I tools/check_docs.py --self-test
      - run: python3 -I tools/check_docs.py
