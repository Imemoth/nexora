name: supabase-schema-tests

# Disposable PostgreSQL 17 only. Never connects to the hosted Supabase project and uses no secrets.
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  push:
    branches: ['claude/**']
    paths: ['supabase/**', '.github/workflows/supabase-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Assert PostgreSQL major version is 17
        run: |
          v=$(psql -d postgres -tAc "select current_setting('server_version_num')::int")
          echo "server_version_num=$v"; test "$v" -ge 170000 -a "$v" -lt 180000
      - name: Migrations plus rollback suites (Phase 2B regression and S1)
        run: supabase/tests/run_local.sh nx_ci
      - name: Standalone guard_row fix is isolated and composes with S1
        run: supabase/tests/verify_minimal_fix.sh nx_fix
      - name: Multi-session lock discipline with negative control
        run: supabase/tests/concurrency/lock_discipline.sh nx_ci
      - name: S2 multi-session duplicate push with negative control
        run: supabase/tests/concurrency/s2_duplicate_push.sh nx_ci
      - name: S2 mutation checks (every deliberate break must be caught)
        run: supabase/tests/mutation_checks.sh nx_mut
      - name: S3/S4 multi-session tests (pull never skips, concurrent resolutions, revoke vs push)
        run: supabase/tests/concurrency/s3_s4_concurrency.sh nx_ci
      - name: S3 and S4 rollbacks restore the catalog exactly
        run: supabase/tests/verify_rollbacks.sh nx_rb
