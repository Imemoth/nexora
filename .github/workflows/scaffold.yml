# Temporary one-shot workflow: generates the Flutter Windows scaffold on CI so
# that no Flutter SDK is needed on the owner's machine. Removed after the
# scaffold has been committed.
name: scaffold-once

on:
  push:
    branches: [feature/phase-0-foundation]
    paths: [".github/workflows/scaffold.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter 3.47.9 (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"

      - name: Record Flutter and Dart versions
        shell: bash
        run: flutter --version

      - name: Generate Windows scaffold
        shell: bash
        run: |
          mkdir -p scaffold
          cd scaffold
          flutter create --platforms=windows --project-name nexora --org com.nexora .
          echo "--- generated tree ---"
          find . -maxdepth 2 -not -path "./windows/flutter/*" | sort

      - name: Upload scaffold
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-windows-scaffold
          path: scaffold
          include-hidden-files: true
          retention-days: 7
